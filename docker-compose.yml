version: '3.8'

# ─── SKYRA Docker Compose — Phase 16 ──────────────────────────────────────────
# Four-service stack: mongo, ml, backend, frontend
#
# Minimum viable startup (no credentials required):
#   docker compose up --build
#
# All external services (OpenAI, Pinecone, Bhashini, AWS S3, IMD) are
# credential-gated and fall back gracefully when unconfigured.
#
# Usage with credentials:
#   Copy .env.example to .env, fill in desired values, then:
#   docker compose --env-file .env up --build

services:

  # ─── MongoDB ─────────────────────────────────────────────────────────────────
  # Optional: backend falls back to in-memory mode when disconnected.
  mongo:
    image: mongo:7.0
    container_name: skyra-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - skyra-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ML Microservice (FastAPI / Uvicorn) ─────────────────────────────────────
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: skyra-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      - PORT=8000
    networks:
      - skyra-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\", timeout=3)'"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s

  # ─── Node.js Backend (Express 5) ─────────────────────────────────────────────
  # Depends on ML (service_healthy). MongoDB dependency is intentionally
  # service_started, not service_healthy — MongoDB is optional and the backend
  # starts in in-memory mode when it cannot connect.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skyra-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_started
      ml:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      # CORS: allow requests from the Nginx frontend container
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      # MongoDB — optional; falls back to in-memory alert mode when empty
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/skyra}
      # ML microservice — must use Docker service name (not localhost)
      - ML_SERVICE_URL=http://ml:8000
      # OpenWeather — optional; Open-Meteo is the primary NWP provider
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      # AWS S3 — optional; falls back to in-memory archive when unconfigured
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-skyra-telemetry-archive}
      # OpenAI — optional; deterministic grounded mock active when absent
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Pinecone — optional; FAISS local vector store is the active default
      - PINECONE_ENABLED=${PINECONE_ENABLED:-false}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-skyra-disaster-kb}
      - PINECONE_NAMESPACE=${PINECONE_NAMESPACE:-default}
      - PINECONE_DIMENSION=${PINECONE_DIMENSION:-1536}
      # Bhashini — optional; falls back to browser Web Speech API when absent
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-}
      - BHASHINI_INFERENCE_KEY=${BHASHINI_INFERENCE_KEY:-}
      - BHASHINI_PIPELINE_ID=${BHASHINI_PIPELINE_ID:-}
      # Multi-channel alert webhook — optional
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # IMD API — optional; uses verified fixture when unconfigured
      - IMD_API_KEY=${IMD_API_KEY:-}
    networks:
      - skyra-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  # ─── Nginx Frontend (React/Vite production build) ────────────────────────────
  # Nginx proxies /api/* requests to the backend container.
  # VITE_API_URL is intentionally empty so the frontend uses relative URLs
  # (e.g. /api/intelligence) — Nginx resolves them to http://backend:5000/api/.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string = use relative paths; Nginx proxy resolves /api/* → backend
        - VITE_API_URL=
    container_name: skyra-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skyra-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  skyra-network:
    driver: bridge

volumes:
  # Persistent MongoDB data across container restarts
  mongo-data:
    driver: local
