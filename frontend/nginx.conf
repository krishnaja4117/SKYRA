server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React SPA — all non-API routes fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Node.js backend container.
    # The frontend build uses VITE_API_URL="" (empty) so all /api/* calls
    # use relative paths and land here. Nginx resolves them to the backend
    # Docker service name, avoiding any localhost references inside the cluster.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reasonable timeouts for backend calls (ML inference can take ~2-3s)
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Generic error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
