<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKYRA Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              if (reg.installing) console.log('[SKYRA] Service worker installing');
              else if (reg.active) console.log('[SKYRA] Service worker active & ready for offline operation');
            })
            .catch((err) => {
              console.warn('[SKYRA] Service worker registration error:', err.message);
            });
        });
      }
    </script>
  </body>
</html>
